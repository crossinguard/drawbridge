schema: drawbridge-outcomes/1
terminology:
  outcome: Course Outcome
  evidence: Evidence Outcome
  objective: Learning Objective
course:
  title: Geometry
  code: MATH-GEOM
outcomes:
  - id: co_geo_cong
    text: Use rigid transformations to establish congruence and prove geometric
      theorems through formal reasoning and construction.
    evidence:
      - id: eo_geo_co
        text: "Congruence (G-CO): transformations, congruence criteria, theorems, and
          constructions."
        scope:
          - lo_geo_co1
          - lo_geo_co2
          - lo_geo_co3
          - lo_geo_co4
          - lo_geo_co5
          - lo_geo_co6
          - lo_geo_co7
          - lo_geo_co8
          - lo_geo_co9
          - lo_geo_co10
          - lo_geo_co11
          - lo_geo_co12
          - lo_geo_co13
  - id: co_geo_sim
    text: Apply similarity transformations and right-triangle trigonometry to prove
      relationships and solve problems.
    evidence:
      - id: eo_geo_srt
        text: Similarity, Right Triangles, and Trigonometry (G-SRT).
        scope:
          - lo_geo_srt1
          - lo_geo_srt2
          - lo_geo_srt3
          - lo_geo_srt4
          - lo_geo_srt5
          - lo_geo_srt6
          - lo_geo_srt7
          - lo_geo_srt8
  - id: co_geo_circ
    text: Analyze circles and use the coordinate plane to describe and prove
      geometric relationships algebraically.
    evidence:
      - id: eo_geo_c
        text: "Circles (G-C): understand and apply theorems about circles."
        scope:
          - lo_geo_c1
          - lo_geo_c2
          - lo_geo_c3
          - lo_geo_c5
      - id: eo_geo_gpe
        text: Expressing Geometric Properties with Equations (G-GPE).
        scope:
          - lo_geo_gpe1
          - lo_geo_gpe2
          - lo_geo_gpe4
          - lo_geo_gpe5
          - lo_geo_gpe6
          - lo_geo_gpe7
  - id: co_geo_meas
    text: Compute geometric measures in two and three dimensions and model
      real-world objects with geometry.
    evidence:
      - id: eo_geo_gmd
        text: Geometric Measurement and Dimension (G-GMD).
        scope:
          - lo_geo_gmd1
          - lo_geo_gmd3
          - lo_geo_gmd4
      - id: eo_geo_mg
        text: Modeling with Geometry (G-MG).
        scope:
          - lo_geo_mg1
          - lo_geo_mg2
          - lo_geo_mg3
  - id: co_geo_prob
    text: Use the rules of probability, including conditional probability and
      independence, to compute and interpret likelihoods.
    evidence:
      - id: eo_geo_cp
        text: Conditional Probability and the Rules of Probability (S-CP).
        scope:
          - lo_geo_cp1
          - lo_geo_cp2
          - lo_geo_cp3
          - lo_geo_cp4
          - lo_geo_cp5
          - lo_geo_cp6
          - lo_geo_cp7
          - lo_geo_cp8
          - lo_geo_cp9
objectives:
  - id: lo_geo_co1
    text: G-CO.1 — Know precise definitions of angle, circle, perpendicular line,
      parallel line, and line segment based on undefined notions.
    maps_to:
      - co_geo_cong
  - id: lo_geo_co2
    text: G-CO.2 — Represent transformations in the plane and describe them as
      functions that take points to points.
    maps_to:
      - co_geo_cong
  - id: lo_geo_co3
    text: G-CO.3 — Describe the rotations and reflections that carry a rectangle,
      parallelogram, trapezoid, or regular polygon onto itself.
    maps_to:
      - co_geo_cong
  - id: lo_geo_co4
    text: G-CO.4 — Develop definitions of rotations, reflections, and translations
      in terms of angles, circles, perpendicular and parallel lines, and
      segments.
    maps_to:
      - co_geo_cong
  - id: lo_geo_co5
    text: G-CO.5 — Given a figure and a transformation, draw the image; specify a
      sequence of transformations that maps one figure to another.
    maps_to:
      - co_geo_cong
  - id: lo_geo_co6
    text: G-CO.6 — Use rigid motions to decide whether two figures are congruent.
    maps_to:
      - co_geo_cong
  - id: lo_geo_co7
    text: G-CO.7 — Show that two triangles are congruent iff corresponding pairs of
      sides and angles are congruent.
    maps_to:
      - co_geo_cong
  - id: lo_geo_co8
    text: G-CO.8 — Explain how the criteria for triangle congruence (ASA, SAS, SSS)
      follow from the definition of congruence via rigid motions.
    maps_to:
      - co_geo_cong
  - id: lo_geo_co9
    text: G-CO.9 — Prove theorems about lines and angles (vertical angles, parallel
      lines cut by a transversal, perpendicular bisectors).
    maps_to:
      - co_geo_cong
  - id: lo_geo_co10
    text: G-CO.10 — Prove theorems about triangles (angle sum, base angles of
      isosceles triangles, midsegment, medians meet at a point).
    maps_to:
      - co_geo_cong
  - id: lo_geo_co11
    text: G-CO.11 — Prove theorems about parallelograms (opposite sides/angles,
      diagonals bisect, rectangle criterion).
    maps_to:
      - co_geo_cong
  - id: lo_geo_co12
    text: G-CO.12 — Make formal geometric constructions with a variety of tools and
      methods (compass and straightedge, dynamic software).
    maps_to:
      - co_geo_cong
  - id: lo_geo_co13
    text: G-CO.13 — Construct an equilateral triangle, a square, and a regular
      hexagon inscribed in a circle.
    maps_to:
      - co_geo_cong
  - id: lo_geo_srt1
    text: G-SRT.1 — Verify experimentally the properties of dilations given by a
      center and a scale factor.
    maps_to:
      - co_geo_sim
  - id: lo_geo_srt2
    text: G-SRT.2 — Use similarity transformations to define similarity and
      establish the AA criterion for triangle similarity.
    maps_to:
      - co_geo_sim
  - id: lo_geo_srt3
    text: G-SRT.3 — Use the properties of similarity transformations to establish
      the AA criterion for two triangles to be similar.
    maps_to:
      - co_geo_sim
  - id: lo_geo_srt4
    text: G-SRT.4 — Prove theorems about triangles using similarity (a line parallel
      to one side divides the other two proportionally; Pythagorean theorem).
    maps_to:
      - co_geo_sim
  - id: lo_geo_srt5
    text: G-SRT.5 — Use congruence and similarity criteria to solve problems and
      prove relationships in geometric figures.
    maps_to:
      - co_geo_sim
  - id: lo_geo_srt6
    text: G-SRT.6 — Understand that side ratios in right triangles are properties of
      the angles, leading to definitions of trigonometric ratios.
    maps_to:
      - co_geo_sim
  - id: lo_geo_srt7
    text: G-SRT.7 — Explain and use the relationship between the sine and cosine of
      complementary angles.
    maps_to:
      - co_geo_sim
  - id: lo_geo_srt8
    text: G-SRT.8 — Use trigonometric ratios and the Pythagorean theorem to solve
      right triangles in applied problems.
    maps_to:
      - co_geo_sim
  - id: lo_geo_c1
    text: G-C.1 — Prove that all circles are similar.
    maps_to:
      - co_geo_circ
  - id: lo_geo_c2
    text: G-C.2 — Identify and describe relationships among inscribed angles, radii,
      and chords.
    maps_to:
      - co_geo_circ
  - id: lo_geo_c3
    text: G-C.3 — Construct the inscribed and circumscribed circles of a triangle;
      prove properties of angles for a quadrilateral inscribed in a circle.
    maps_to:
      - co_geo_circ
  - id: lo_geo_c5
    text: G-C.5 — Derive the arc length and area of a sector using similarity;
      define the radian measure of an angle.
    maps_to:
      - co_geo_circ
  - id: lo_geo_gpe1
    text: G-GPE.1 — Derive the equation of a circle given center and radius using
      the Pythagorean theorem; complete the square to find center and radius.
    maps_to:
      - co_geo_circ
  - id: lo_geo_gpe2
    text: G-GPE.2 — Derive the equation of a parabola given a focus and directrix.
    maps_to:
      - co_geo_circ
  - id: lo_geo_gpe4
    text: G-GPE.4 — Use coordinates to prove simple geometric theorems algebraically.
    maps_to:
      - co_geo_circ
  - id: lo_geo_gpe5
    text: G-GPE.5 — Prove the slope criteria for parallel and perpendicular lines
      and use them to solve geometric problems.
    maps_to:
      - co_geo_circ
  - id: lo_geo_gpe6
    text: G-GPE.6 — Find the point on a directed line segment that partitions it in
      a given ratio.
    maps_to:
      - co_geo_circ
  - id: lo_geo_gpe7
    text: G-GPE.7 — Use coordinates to compute perimeters of polygons and areas of
      triangles and rectangles.
    maps_to:
      - co_geo_circ
  - id: lo_geo_gmd1
    text: G-GMD.1 — Give an informal argument for the formulas for circumference,
      area of a circle, and volume of a cylinder, pyramid, and cone.
    maps_to:
      - co_geo_meas
  - id: lo_geo_gmd3
    text: G-GMD.3 — Use volume formulas for cylinders, pyramids, cones, and spheres
      to solve problems.
    maps_to:
      - co_geo_meas
  - id: lo_geo_gmd4
    text: G-GMD.4 — Identify the shapes of two-dimensional cross-sections of
      three-dimensional objects and solids of revolution.
    maps_to:
      - co_geo_meas
  - id: lo_geo_mg1
    text: G-MG.1 — Use geometric shapes, measures, and properties to describe
      objects.
    maps_to:
      - co_geo_meas
  - id: lo_geo_mg2
    text: G-MG.2 — Apply concepts of density based on area and volume in modeling
      situations.
    maps_to:
      - co_geo_meas
  - id: lo_geo_mg3
    text: G-MG.3 — Apply geometric methods to solve design problems (minimize cost,
      satisfy physical constraints).
    maps_to:
      - co_geo_meas
  - id: lo_geo_cp1
    text: S-CP.1 — Describe events as subsets of a sample space using unions,
      intersections, and complements.
    maps_to:
      - co_geo_prob
  - id: lo_geo_cp2
    text: S-CP.2 — Understand that two events are independent if the probability of
      both equals the product of their probabilities.
    maps_to:
      - co_geo_prob
  - id: lo_geo_cp3
    text: S-CP.3 — Understand conditional probability and interpret independence in
      terms of conditional probabilities.
    maps_to:
      - co_geo_prob
  - id: lo_geo_cp4
    text: S-CP.4 — Construct and interpret two-way frequency tables to approximate
      conditional probabilities and test independence.
    maps_to:
      - co_geo_prob
  - id: lo_geo_cp5
    text: S-CP.5 — Recognize and explain the concepts of conditional probability and
      independence in everyday situations.
    maps_to:
      - co_geo_prob
  - id: lo_geo_cp6
    text: S-CP.6 — Find the conditional probability of A given B as the fraction of
      B's outcomes that also belong to A.
    maps_to:
      - co_geo_prob
  - id: lo_geo_cp7
    text: S-CP.7 — Apply the Addition Rule, P(A or B) = P(A) + P(B) − P(A and B),
      and interpret the answer in context.
    maps_to:
      - co_geo_prob
  - id: lo_geo_cp8
    text: S-CP.8 — Apply the general Multiplication Rule, P(A and B) = P(A)·P(B|A),
      and interpret the answer in context.
    maps_to:
      - co_geo_prob
  - id: lo_geo_cp9
    text: S-CP.9 — Use permutations and combinations to compute probabilities of
      compound events.
    maps_to:
      - co_geo_prob
