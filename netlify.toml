[build]
  command = "pnpm run build"
  publish = "dist"

# Privacy by architecture, enforced at the edge: this header pins the
# network/privacy lockdown (hard rule #1) — the app cannot talk to any origin
# after page load. It deliberately omits script-src/style-src; those are
# hash-locked in the per-build <meta> CSP that Astro emits (see astro.config.mjs
# security.csp). frame-ancestors lives here because a <meta> CSP can't set it.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
