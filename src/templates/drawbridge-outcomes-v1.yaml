# drawbridge-outcomes/1 — starter template
#
# Copy this file, replace the example content, and open it in the Outcome Builder
# (/outcomes) or hand it to any tool that reads the format. Comments and any keys
# you add are preserved on export — edit freely.
#
# The three tiers (rename them under `terminology` to fit your program):
#   outcomes   — broad content domains: the areas the course covers.
#   evidence   — assessed outcomes nested under a domain: what you'd assess.
#   objectives — learning objectives: granular, teachable steps that map back up
#                to one or more domains.
#
# IDs are immutable once downstream work references them. Pick a short stable id
# and never renumber it; display order is what changes, not the id.

schema: drawbridge-outcomes/1

# Rename these to your program's vocabulary — the UI reads these labels.
terminology:
  outcome: Content Domain
  evidence: Assessed Outcome
  objective: Learning Objective

course:
  title: Your Course Title
  code: ABC101

outcomes:
  - id: co_1
    text: Name a broad content domain the course covers.
    evidence:
      - id: eo_1a
        text: Describe one observable way a learner demonstrates this domain.
        scope: [ lo_1 ] # advisory link to an objective; never enforced
      - id: eo_1b
        text: Add another assessed outcome, or delete this line.

objectives:
  - id: lo_1
    text: A specific, teachable objective supporting the domain above.
    maps_to: [ co_1 ] # every objective maps to one or more domains
